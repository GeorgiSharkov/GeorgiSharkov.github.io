name: Publish Weekly SOC Threat Brief

on:
  schedule:
    # Two UTC slots cover 09:00 London in both GMT and BST; the gate selects one.
    - cron: "0 8,9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-threat-brief
  cancel-in-progress: false

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: gate
        name: Check London time, credentials and weekly publication
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, date
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/London"))
          ready = True
          if os.environ["EVENT_NAME"] == "schedule" and now.hour != 9:
              ready = False
          elif not os.environ.get("API_KEY"):
              print("::warning::One-time setup required: add the OPENAI_API_KEY repository Actions secret. No article was generated.")
              ready = False
          else:
              catalogue = json.load(open("threat-articles.json", encoding="utf-8"))
              week = now.date().isocalendar()[:2]
              if any(item.get("researchWeek") == f"{week[0]}-W{week[1]:02d}" for item in catalogue):
                  print("This week's hosted threat brief has already been published.")
                  ready = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ready={str(ready).lower()}\n")
          PY

  research:
    needs: check-schedule
    if: needs.check-schedule.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      brief: ${{ steps.writer.outputs.final-message }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare current research window
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from pathlib import Path
          today = datetime.now(ZoneInfo("Europe/London")).date()
          Path("research-window.txt").write_text(f"Publication date: {today}\nResearch window: {today - timedelta(days=7)} to {today}\n")
          PY
      - name: Research and write the SOC brief
        id: writer
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/weekly-threat-brief.md
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--config", "web_search=\"live\"", "--output-schema", ".github/codex/weekly-threat.schema.json"]'

  publish:
    needs: research
    if: needs.research.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Validate and render the researched article
        env:
          WEEKLY_BRIEF_JSON: ${{ needs.research.outputs.brief }}
        run: python scripts/publish_weekly_threat_brief.py
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-threat-*.html threat-articles.json threat-briefs.html index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Publish weekly SOC threat brief"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
