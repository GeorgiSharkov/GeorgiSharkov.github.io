name: Update Cyber News Data

on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-cyber-news.yml"
      - "scripts/update_cyber_news_data.py"
      - "scripts/feed_http.py"

permissions:
  contents: write

concurrency:
  group: cyber-news-main-writer
  cancel-in-progress: false

jobs:
  refresh-news-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Refresh publisher snapshot
        run: python scripts/update_cyber_news_data.py

      - name: Commit snapshot if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cyber-news-data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update cyber news data"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git -c credential.helper='!gh auth git-credential' push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} was rejected; retrying on the latest main branch."
            sleep $((attempt * 2))
          done

          echo "Unable to publish the refreshed news snapshot after 3 attempts."
          exit 1
