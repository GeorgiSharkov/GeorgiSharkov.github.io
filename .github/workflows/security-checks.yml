name: Site Security Checks

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "**.html"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Browser rendering security regression checks
        run: node --test tests/security.test.cjs
      - name: Public feed network boundary checks
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
