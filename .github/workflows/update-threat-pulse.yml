name: Update Threat Pulse Data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-threat-pulse.yml"
      - "scripts/update_threat_pulse_data.py"

permissions:
  contents: write

concurrency:
  group: threat-pulse-main-writer
  cancel-in-progress: false

jobs:
  refresh-kev-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Threat Pulse snapshot
        run: python scripts/update_threat_pulse_data.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threat-pulse-data.json radware-threat-map.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Threat Pulse data"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} was rejected; retrying on the latest main branch."
            sleep $((attempt * 2))
          done

          echo "Unable to publish the refreshed snapshot after 3 attempts."
          exit 1
